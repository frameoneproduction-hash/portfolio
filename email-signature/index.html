<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Email signature concept — desktop and mobile</title>
<style>
  body{margin:0;font:15px/1.5 Arial,Helvetica,sans-serif;background:#0F2A44;color:#E8EEF4}
  header{padding:28px 20px 6px;text-align:center}
  h1{margin:0 0 6px;font-size:22px}
  p{margin:0;color:#B8C6D4}
  a{color:#F59E0B}
  .wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:24px 16px 40px}
  figure{margin:0;text-align:center}
  figcaption{margin-bottom:10px;font-weight:bold;color:#F59E0B}
  iframe{border:0;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .desk{width:640px;height:330px;max-width:calc(100vw - 32px)}
  .mob{width:360px;height:420px;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<header>
  <h1>Asset-finance email signature — concept</h1>
  <p>Same HTML in both frames. Readable with images blocked, Outlook-safe button. <a href="signature.html">Open the raw signature</a></p>
</header>
<div class="wrap">
  <figure><figcaption>Desktop</figcaption><iframe class="desk" src="signature.html" title="Desktop preview"></iframe></figure>
  <figure><figcaption>Mobile</figcaption><iframe class="mob" src="signature.html" title="Mobile preview"></iframe></figure>
</div>
</body>
</html>
