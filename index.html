<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maria — projekty koncepcyjne</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#14161F;--ink:#F4F1EA;--muted:#9aa3b2;--acc:#FF7A45;--line:#2a2f3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(860px,100% - 32px);margin:0 auto;padding:72px 0}
h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin:0 0 12px}
p{color:var(--muted);margin:0 0 40px}
a.card{display:block;border-top:1px solid var(--line);padding:26px 0;color:var(--ink);text-decoration:none}
a.card:last-of-type{border-bottom:1px solid var(--line)}
a.card b{display:block;font-size:22px}
a.card span{color:var(--muted)}
a.card:hover b{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Projekty koncepcyjne</h1>
  <p>Przykłady przygotowane do ofert na Useme. Strony mają charakter demonstracyjny.</p>
  <a class="card" href="email-szablon/"><b>Szablon e-mail dla sieci sprzedaży</b><span>Table-based HTML · Outlook · tryb ciemny · mobile</span></a>
</div>
</body>
</html>
